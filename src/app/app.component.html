<app-header />
<main>
  <ul id="users">
    @for(user of users; track user.id) {
    <li>
      <app-user [user]="user" [selected]="user.id == selectedUserId" (select)="onSelectUser($event)" />
    </li>
    }
  </ul>
  @if (selectedUser) {
  <app-tasks [name]="selectedUser.name" [userId]="selectedUser.id"></app-tasks>
  } @else {
  <p id="fallback">Select a user to see thier tasks !</p>
  }

  <!-- <app-tasks *ngIf="selectedUser; else fallback" [name]="selectedUser.name"></app-tasks>
  <ng-template #fallback>
    <p id="fallback">Select a user to see thier tasks !</p>
  </ng-template> -->
</main>
